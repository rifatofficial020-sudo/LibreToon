[package]
name = "libretoon"
version = "0.8.0"
edition = "2024"

[dependencies]
eframe = "=0.37.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rfd = "0.17"
xml-rs = "=0.8.29"
flate2 = "1"
crc32fast = "1"
geo = { version = "=0.33.1", default-features = false }
lyon_tessellation = "=1.0.22"

ttf-parser = "=0.25.1"

image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
arboard = "=3.7.0"
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland"] }
